<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
}

body {
  font-family: Georgia, 'Times New Roman', serif;
  background:
    radial-gradient(circle at 15% 15%, rgba(217, 194, 126, 0.18), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(217, 194, 126, 0.13), transparent 50%),
    linear-gradient(160deg, #24361f, #3d5a3d 55%, #2f4530);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

body::before, body::after {
  content: '';
  position: absolute;
  width: 220px;
  height: 220px;
  border: 1px solid rgba(217, 194, 126, 0.35);
  border-radius: 50%;
}

body::before { top: -110px; left: -110px; }
body::after { bottom: -110px; right: -110px; }

.card {
  position: relative;
  z-index: 2;
  text-align: center;
  color: #f7f3ea;
  padding: 0 80px;
}

.logo-ring {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  margin: 0 auto 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(217, 194, 126, 0.14);
  box-shadow: 0 0 0 2px rgba(217, 194, 126, 0.6);
}

.logo-ring svg {
  width: 46px;
  height: 46px;
  stroke: #d9c27e;
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.name {
  font-weight: 700;
  font-size: 50px;
  letter-spacing: 3px;
  text-transform: uppercase;
  line-height: 1.1;
  margin-bottom: 16px;
}

.tagline {
  font-family: 'Brush Script MT', 'Segoe Script', cursive;
  color: #d9c27e;
  font-size: 30px;
  letter-spacing: 1px;
  margin-bottom: 30px;
}

.quote {
  font-style: italic;
  font-weight: 500;
  font-size: 30px;
  line-height: 1.4;
  color: rgba(247, 243, 234, 0.92);
  max-width: 780px;
  margin: 0 auto;
}

.kicker {
  margin-top: 32px;
  font-size: 18px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-family: Arial, sans-serif;
  color: rgba(247, 243, 234, 0.6);
}
</style>
</head>
<body>
  <div class="card">
    <div class="logo-ring"><svg viewBox='0 0 24 24'><circle cx='6.5' cy='9' r='2'/><circle cx='11' cy='6' r='2'/><circle cx='15' cy='6' r='2'/><circle cx='18.5' cy='9' r='2'/><ellipse cx='12' cy='16' rx='6' ry='4.5'/></svg></div>
    <div class="name">Dogcytocin et Racines</div>
    <div class="tagline">Protéger. Combattre. Sauver.</div>
    <div class="quote">« Si j'attends d'être prête, certains d'entre eux ne seront plus là »</div>
    <div class="kicker">Refuge pour chiens · Bretagne</div>
  </div>
</body>
</html>
