<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
}

body {
  font-family: Georgia, 'Times New Roman', serif;
  background:
    radial-gradient(circle at 15% 15%, rgba(217, 194, 126, 0.18), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(217, 194, 126, 0.13), transparent 50%),
    linear-gradient(160deg, #24361f, #3d5a3d 55%, #2f4530);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

body::before, body::after {
  content: '';
  position: absolute;
  width: 220px;
  height: 220px;
  border: 1px solid rgba(217, 194, 126, 0.35);
  border-radius: 50%;
}

body::before { top: -110px; left: -110px; }
body::after { bottom: -110px; right: -110px; }

.card {
  position: relative;
  z-index: 2;
  text-align: center;
  color: #f7f3ea;
  padding: 0 80px;
}

.logo-ring {
  width: 108px;
  height: 108px;
  border-radius: 50%;
  margin: 0 auto 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fffdf7;
  box-shadow: 0 0 0 4px rgba(217, 194, 126, 0.55), 0 12px 30px rgba(0,0,0,0.3);
  overflow: hidden;
}

.logo-ring img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
}

.name {
  font-weight: 700;
  font-size: 50px;
  letter-spacing: 3px;
  text-transform: uppercase;
  line-height: 1.1;
  margin-bottom: 16px;
}

.tagline {
  font-family: 'Brush Script MT', 'Segoe Script', cursive;
  color: #d9c27e;
  font-size: 30px;
  letter-spacing: 1px;
  margin-bottom: 30px;
}

.quote {
  font-style: italic;
  font-weight: 500;
  font-size: 30px;
  line-height: 1.4;
  color: rgba(247, 243, 234, 0.92);
  max-width: 780px;
  margin: 0 auto;
}

.kicker {
  margin-top: 32px;
  font-size: 18px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-family: Arial, sans-serif;
  color: rgba(247, 243, 234, 0.6);
}
</style>
</head>
