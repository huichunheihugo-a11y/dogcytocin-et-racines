<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — Dogcytocin et Racines</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="admin-gate-overlay" id="admin-gate-overlay">
  <div class="gate-box">
    <img src="images/logo.jpg" alt="Dogcytocin et Racines" class="gate-logo">
    <h2>Accès admin</h2>
    <p>Entre le mot de passe administrateur pour continuer.</p>
    <form id="admin-gate-form" autocomplete="off">
      <div class="admin-password-row">
        <input type="password" id="admin-password" placeholder="Mot de passe" autocomplete="off">
        <button type="button" id="admin-password-toggle" aria-label="Afficher le mot de passe">👁</button>
      </div>
      <button type="submit" class="btn btn-primary">Entrer</button>
    </form>
    <p id="admin-gate-error" class="gate-error" hidden></p>
  </div>
</div>

<div class="admin-shell" id="admin-shell" hidden>
  <aside class="admin-nav">
    <div class="admin-nav-brand">
      <img src="images/logo.jpg" alt="" class="admin-nav-logo">
      <span>Administration</span>
    </div>
    <nav class="admin-nav-links">
      <a href="#" class="admin-nav-link active" data-tab="comments">Livre d'or</a>
      <a href="#" class="admin-nav-link" data-tab="rejected">Messages refusés</a>
    </nav>
  </aside>

  <main class="admin-main">
    <h1 id="admin-tab-title">Livre d'or</h1>
    <p id="admin-action-msg" class="admin-auth-msg" hidden></p>

    <div id="admin-tab-comments" class="admin-tab">
      <div id="admin-list" class="admin-list"></div>
    </div>

    <div id="admin-tab-rejected" class="admin-tab" hidden>
      <p class="admin-tab-intro">Messages bloqués automatiquement par le filtre anti-spam. Vérifie qu'il ne s'agit pas d'un vrai visiteur bloqué par erreur avant de supprimer.</p>
      <div id="admin-rejected-list" class="admin-list"></div>
    </div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
