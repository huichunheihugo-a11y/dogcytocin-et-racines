<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — Dogcytocin et Racines</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-nav">
    <div class="admin-nav-brand">
      <img src="images/logo.jpg" alt="" class="admin-nav-logo">
      <span>Administration</span>
    </div>
    <nav class="admin-nav-links">
      <a href="#" class="admin-nav-link active" data-tab="comments">Commentaires</a>
      <a href="#" class="admin-nav-link" data-tab="foster">Familles d'accueil <span id="admin-foster-badge" class="admin-nav-badge" hidden>0</span></a>
      <a href="#" class="admin-nav-link" data-tab="rejected">Messages refusés</a>
    </nav>
  </aside>

  <main class="admin-main">
    <h1 id="admin-tab-title">Commentaires</h1>

    <div class="admin-auth">
      <div id="admin-auth-form">
        <label for="admin-password">1. Entrez le mot de passe</label>
        <div class="admin-auth-row">
          <div class="admin-password-row">
            <input type="password" id="admin-password" class="field" autocomplete="off" placeholder="Mot de passe">
            <button type="button" id="admin-password-toggle" aria-label="Afficher le mot de passe">
              <span id="admin-password-toggle-icon" class="admin-password-toggle-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </span>
              <span id="admin-password-toggle-label">Afficher</span>
            </button>
          </div>
          <button type="button" id="admin-remember" class="btn btn-primary">Valider</button>
        </div>
        <p id="admin-auth-msg" class="admin-auth-msg" hidden></p>
      </div>

      <div id="admin-auth-connected" class="admin-auth-connected" hidden>
        <span class="admin-auth-connected-badge">✓ Connecté</span>
        <button type="button" id="admin-logout" class="admin-logout-btn">Se déconnecter</button>
      </div>
    </div>

    <div id="admin-tab-comments" class="admin-tab">
      <div class="admin-subtabs">
        <button type="button" class="admin-subtab-btn active" data-subtab="list">Liste des messages</button>
        <button type="button" class="admin-subtab-btn" data-subtab="stats">Statistiques</button>
      </div>

      <div id="admin-subtab-list" class="admin-subtab-panel">
        <p class="admin-tab-intro">2. Voici tous les messages laissés par les visiteurs du site.</p>
        <div class="admin-sort-controls">
          <span class="admin-sort-label">Ordre d'affichage</span>
          <div class="admin-sort-toggle">
            <button type="button" class="admin-sort-btn active" data-order="desc">Plus récents d'abord</button>
            <button type="button" class="admin-sort-btn" data-order="asc">Plus anciens d'abord</button>
          </div>
        </div>
        <div id="admin-list" class="admin-list"></div>
      </div>

      <div id="admin-subtab-stats" class="admin-subtab-panel" hidden>
        <div id="admin-stats-content"></div>
      </div>
    </div>

    <div id="admin-tab-foster" class="admin-tab" hidden>
      <div class="admin-status-filter" id="admin-foster-filter">
        <button type="button" class="admin-status-filter-btn active" data-status-filter="all">Toutes</button>
        <button type="button" class="admin-status-filter-btn" data-status-filter="nouvelle">Nouvelles</button>
        <button type="button" class="admin-status-filter-btn" data-status-filter="en_cours">En cours</button>
        <button type="button" class="admin-status-filter-btn" data-status-filter="acceptee">Acceptées</button>
        <button type="button" class="admin-status-filter-btn" data-status-filter="refusee">Refusées</button>
      </div>
      <div id="admin-foster-list" class="admin-list"></div>
    </div>

    <div id="admin-tab-rejected" class="admin-tab" hidden>
      <div id="admin-rejected-list" class="admin-list"></div>
    </div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
